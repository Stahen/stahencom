<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    p { font-size: 1.1rem; color: #94a3b8; max-width: 480px; line-height: 1.6; }
    .btn {
      margin-top: 24px;
      padding: 12px 28px;
      background: #3b82f6;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>Stahen mortsontila aaauauaua</h1>

</html>
