<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Stahen</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12090b">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f5e9ea;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,59,74,.14), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(214,40,57,.16), transparent 50%),
        #12090b;
    }
    .code {
      font-size: clamp(5rem, 22vw, 11rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: .04em;
      color: #ff3b4a;
      text-shadow: 0 8px 40px rgba(255,59,74,.35);
    }
    h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); margin-top: 8px; }
    p { margin-top: 10px; color: #a38a8d; max-width: 420px; }
    a.btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      border-radius: 999px;
      background: #ff3b4a;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    a.btn:hover { background: #d62839; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
